name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@v4
        with:
          path: bin

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for dir in bin/smolify-*; do
            target="${dir#bin/smolify-}"; os="${target%-*}"; arch="${target#*-}"
            name="smolify_${version}_${os}_${arch}"
            mkdir "$name"
            cp "$dir"/* README.md LICENSE "$name"/
            chmod +x "$name"/smolify* || true
            if [ "$os" = windows ]; then
              (cd "$name" && zip -q "../dist/$name.zip" ./*)
            else
              tar -czf "dist/$name.tar.gz" -C "$name" .
            fi
          done
          (cd dist && sha256sum ./* | sed 's| \./| |' > checksums.txt)
          cat dist/checksums.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

      - name: Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sum() { awk -v f="smolify_${version}_$1.tar.gz" '$2 == f { print $1 }' dist/checksums.txt; }
          url="https://github.com/lunguini/smolify/releases/download/v#{version}/smolify_#{version}"
          cat > smolify.rb <<RUBY
          # Generated by the smolify release workflow. Do not edit.
          cask "smolify" do
            version "${version}"

            on_macos do
              on_arm do
                sha256 "$(sum darwin_arm64)"
                url "${url}_darwin_arm64.tar.gz"
              end
              on_intel do
                sha256 "$(sum darwin_amd64)"
                url "${url}_darwin_amd64.tar.gz"
              end
            end
            on_linux do
              on_arm do
                sha256 "$(sum linux_arm64)"
                url "${url}_linux_arm64.tar.gz"
              end
              on_intel do
                sha256 "$(sum linux_amd64)"
                url "${url}_linux_amd64.tar.gz"
              end
            end

            name "smolify"
            desc "Small, fast Spotify client for the terminal and the desktop"
            homepage "https://github.com/lunguini/smolify"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "smolify"

            # The binary is not notarized; let it run without a Gatekeeper prompt.
            postflight do
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path] if OS.mac?
            end
          end
          RUBY
          cat smolify.rb
          content=$(base64 -w0 smolify.rb)
          sha=$(GH_TOKEN="$TAP_TOKEN" gh api repos/lunguini/homebrew-tap/contents/Casks/smolify.rb --jq .sha 2>/dev/null || true)
          GH_TOKEN="$TAP_TOKEN" gh api -X PUT repos/lunguini/homebrew-tap/contents/Casks/smolify.rb \
            -f message="smolify ${version}" -f content="$content" ${sha:+-f sha="$sha"} --jq .commit.html_url
