name: Build

on:
  push:
    branches: [main, web]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Audio codecs
        run: brew install pkg-config libogg libvorbis flac mpg123
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, goos: darwin, goarch: arm64 }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64 }
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runner: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.goos == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Audio codecs (macOS)
        if: matrix.goos == 'darwin'
        run: brew install pkg-config libogg libvorbis flac mpg123
      - name: Audio codecs (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libogg-dev libvorbis-dev libflac-dev libmpg123-dev libasound2-dev
      - name: Static codecs (macOS, Linux)
        if: matrix.goos != 'windows'
        # The runner is thrown away: removing the codecs' shared libraries
        # leaves the linker their static archives, so users need nothing
        # installed. ALSA and the system libraries stay shared, and on Linux
        # mpg123 too: Ubuntu ships no static archive of it.
        run: |
          if [ "${{ matrix.goos }}" = darwin ]; then
            for f in libogg libvorbis flac mpg123; do rm -f "$(brew --prefix $f)"/lib/*.dylib; done
          else
            sudo rm -f /usr/lib/*-linux-gnu/lib{ogg,vorbis,vorbisenc,vorbisfile,FLAC}.so
            echo 'CGO_LDFLAGS=-lm -lmvec' >> "$GITHUB_ENV" # static vorbis needs these after
          fi
          echo 'PKG_CONFIG=pkg-config --static' >> "$GITHUB_ENV"

      - name: Audio codecs (Windows)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-mpg123

      - name: Static link flags (Windows)
        if: matrix.goos == 'windows'
        run: |
          # libogg's DLL leaves out symbols vorbis-go binds; the static
          # libraries have them, and make a single .exe.
          echo 'EXTLDFLAGS=-static' >> "$GITHUB_ENV"
          echo 'PKG_CONFIG=pkgconf --static' >> "$GITHUB_ENV"
          echo 'CGO_CFLAGS=-DFLAC__NO_DLL' >> "$GITHUB_ENV"
          echo 'CGO_LDFLAGS=-lshlwapi' >> "$GITHUB_ENV" # static mpg123 needs it, unlisted

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-s -w -extldflags '${EXTLDFLAGS:-}'" -o dist/smolify${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/smolify

      - name: Linked libraries
        run: |
          case "${{ matrix.goos }}" in
            darwin) otool -L dist/smolify ;;
            linux) ldd dist/smolify ;;
            windows) objdump -p dist/smolify.exe | grep 'DLL Name' ;;
          esac

      - name: Smoke test
        run: ./dist/smolify${{ matrix.goos == 'windows' && '.exe' || '' }} -h 2>&1 | grep -- -demo

      - uses: actions/upload-artifact@v4
        with:
          name: smolify-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
